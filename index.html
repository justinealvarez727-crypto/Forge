<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5b5bd6" />
    <meta
      name="description"
      content="PromptForge turns a rough idea into a well-engineered AI prompt and teaches prompt engineering with spaced repetition."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>PromptForge</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var s = JSON.parse(localStorage.getItem('pf-settings') || '{}');
        var t = (s.state && s.state.theme) || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>PromptForge needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
